<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Kitchen Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,300;1,8..60,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --canvas: #F5F0E8;
  --parchment: #EDE6D8;
  --parchment-warm: #E8DFD0;
  --parchment-deep: #DED5C5;
  --ink: #2C2C2C;
  --ink-secondary: #5C5347;
  --ink-tertiary: #8B8179;
  --ink-muted: #B5ADA4;
  --terracotta: #C4654A;
  --terracotta-hover: #B55A40;
  --terracotta-light: rgba(196,101,74,0.1);
  --herb: #5B7B5A;
  --herb-light: rgba(91,123,90,0.1);
  --walnut: #8B6F4E;
  --saffron: #D4A843;
  --saffron-light: rgba(212,168,67,0.08);
  --border: rgba(139,111,78,0.15);
  --border-soft: rgba(139,111,78,0.08);
  --border-emphasis: rgba(139,111,78,0.25);
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'Source Serif 4', Georgia, serif;
  --font-hand: 'Caveat', cursive;
}

html { font-size: 16px; }

body {
  font-family: var(--font-body);
  background: var(--canvas);
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* === HEADER === */
.header {
  padding: 40px 56px 0;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  opacity: 0;
  animation: fadeDown 0.6s ease-out 0.1s forwards;
}

.header-left {
  display: flex;
  align-items: baseline;
  gap: 16px;
}

.logo {
  font-family: var(--font-display);
  font-size: 2rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--ink);
}

.logo-accent {
  font-family: var(--font-hand);
  font-size: 1.4rem;
  color: var(--ink-tertiary);
  font-weight: 400;
  position: relative;
  top: -2px;
}

.search-container {
  position: relative;
  width: 280px;
}

.search-input {
  width: 100%;
  padding: 10px 16px 10px 40px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--parchment);
  font-family: var(--font-body);
  font-size: 0.9rem;
  color: var(--ink);
  outline: none;
  transition: border-color 0.2s, background-color 0.2s;
}

.search-input::placeholder { color: var(--ink-muted); }
.search-input:focus {
  border-color: var(--border-emphasis);
  background: var(--parchment-warm);
}

.search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--ink-muted);
  pointer-events: none;
}

/* === LAYOUT === */
.main {
  display: flex;
  padding: 32px 56px 56px;
  gap: 48px;
}

/* === CATEGORIES (BINDER TABS) === */
.categories {
  width: 180px;
  flex-shrink: 0;
  padding-top: 8px;
  opacity: 0;
  animation: fadeRight 0.5s ease-out 0.25s forwards;
}

.categories-label {
  font-family: var(--font-hand);
  font-size: 1.1rem;
  color: var(--ink-muted);
  margin-bottom: 16px;
  padding-left: 4px;
}

.category-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 10px 16px;
  margin-bottom: 2px;
  font-family: var(--font-body);
  font-size: 0.9rem;
  font-weight: 400;
  color: var(--ink-secondary);
  background: none;
  border: none;
  border-radius: 3px;
  cursor: pointer;
  transition: color 0.2s, background 0.2s;
  position: relative;
  letter-spacing: 0.01em;
}

.category-item:hover {
  color: var(--ink);
  background: var(--border-soft);
}

.category-item.active {
  color: var(--terracotta);
  background: var(--terracotta-light);
  font-weight: 500;
}

.category-item.active::before {
  content: '';
  position: absolute;
  left: 0;
  top: 6px;
  bottom: 6px;
  width: 2px;
  background: var(--terracotta);
  border-radius: 1px;
}

.category-count {
  font-family: var(--font-hand);
  font-size: 0.95rem;
  color: var(--ink-muted);
  margin-left: 6px;
}

/* === RECIPE GRID === */
.recipes-area {
  flex: 1;
  min-width: 0;
}

.recipes-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 32px;
  opacity: 0;
  animation: fadeDown 0.5s ease-out 0.35s forwards;
}

.recipes-title {
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.recipes-count {
  font-family: var(--font-hand);
  font-size: 1.15rem;
  color: var(--ink-tertiary);
}

.recipe-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-auto-rows: auto;
  gap: 24px;
}

/* === RECIPE CARDS === */
.recipe-card {
  background: var(--parchment);
  border: 1px solid var(--border-soft);
  border-radius: 3px;
  padding: 28px 24px;
  cursor: pointer;
  transition: background 0.25s, border-color 0.25s;
  position: relative;
  opacity: 0;
  animation: fadeUp 0.45s ease-out forwards;
}

.recipe-card:hover {
  background: var(--parchment-warm);
  border-color: var(--border);
}

/* Featured card — spans 2 columns, different proportion */
.recipe-card.featured {
  grid-column: span 2;
  grid-row: span 2;
  padding: 36px 32px;
  background: var(--parchment-warm);
  border-color: var(--border);
}

/* Tall card */
.recipe-card.tall {
  grid-row: span 2;
}

.card-category {
  font-family: var(--font-hand);
  font-size: 1rem;
  color: var(--terracotta);
  margin-bottom: 8px;
}

.card-title {
  font-family: var(--font-display);
  font-size: 1.2rem;
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.01em;
  margin-bottom: 10px;
}

.featured .card-title {
  font-size: 1.8rem;
  line-height: 1.2;
  margin-bottom: 16px;
}

.card-description {
  font-size: 0.9rem;
  line-height: 1.6;
  color: var(--ink-secondary);
  margin-bottom: 16px;
}

.featured .card-description {
  font-size: 0.95rem;
  max-width: 480px;
}

.card-meta {
  display: flex;
  gap: 16px;
  align-items: center;
  font-size: 0.82rem;
  color: var(--ink-tertiary);
  letter-spacing: 0.02em;
}

.card-meta-item {
  display: flex;
  align-items: center;
  gap: 5px;
}

.card-divider {
  width: 100%;
  height: 1px;
  background: var(--border);
  margin: 16px 0;
}

.card-ingredients {
  margin-top: 12px;
}

.card-ingredients-label {
  font-family: var(--font-hand);
  font-size: 0.95rem;
  color: var(--ink-tertiary);
  margin-bottom: 8px;
}

.card-ingredients-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.ingredient-tag {
  font-size: 0.78rem;
  padding: 3px 10px;
  background: var(--canvas);
  border: 1px solid var(--border-soft);
  border-radius: 2px;
  color: var(--ink-secondary);
  letter-spacing: 0.01em;
}

.card-note {
  margin-top: 16px;
  font-family: var(--font-hand);
  font-size: 1.05rem;
  color: var(--herb);
  line-height: 1.4;
  padding-left: 12px;
  border-left: 2px solid var(--herb-light);
}

/* === RECIPE DETAIL OVERLAY === */
.detail-overlay {
  position: fixed;
  inset: 0;
  background: rgba(44,44,44,0.2);
  z-index: 100;
  display: none;
  align-items: stretch;
  justify-content: flex-end;
  opacity: 0;
  transition: opacity 0.3s;
}

.detail-overlay.open {
  display: flex;
  opacity: 1;
}

.detail-panel {
  width: 680px;
  max-width: 90vw;
  background: var(--canvas);
  height: 100vh;
  overflow-y: auto;
  padding: 48px;
  transform: translateX(40px);
  opacity: 0;
  transition: transform 0.35s ease-out, opacity 0.3s ease-out;
  border-left: 1px solid var(--border);
}

.detail-overlay.open .detail-panel {
  transform: translateX(0);
  opacity: 1;
}

.detail-close {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-body);
  font-size: 0.85rem;
  color: var(--ink-tertiary);
  background: none;
  border: none;
  cursor: pointer;
  padding: 6px 0;
  margin-bottom: 32px;
  transition: color 0.2s;
  letter-spacing: 0.02em;
}

.detail-close:hover { color: var(--ink); }

.detail-category {
  font-family: var(--font-hand);
  font-size: 1.15rem;
  color: var(--terracotta);
  margin-bottom: 8px;
}

.detail-title {
  font-family: var(--font-display);
  font-size: 2.2rem;
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -0.02em;
  margin-bottom: 12px;
}

.detail-description {
  font-size: 1.05rem;
  line-height: 1.7;
  color: var(--ink-secondary);
  margin-bottom: 24px;
  max-width: 520px;
}

.detail-meta {
  display: flex;
  gap: 24px;
  padding: 20px 0;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  margin-bottom: 36px;
}

.detail-meta-block {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.detail-meta-label {
  font-family: var(--font-hand);
  font-size: 0.95rem;
  color: var(--ink-muted);
}

.detail-meta-value {
  font-family: var(--font-display);
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--ink);
}

.detail-columns {
  display: grid;
  grid-template-columns: 200px 1fr;
  gap: 40px;
}

.detail-section-title {
  font-family: var(--font-display);
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 16px;
  letter-spacing: -0.01em;
}

.ingredient-list {
  list-style: none;
}

.ingredient-list li {
  padding: 8px 0;
  font-size: 0.9rem;
  color: var(--ink-secondary);
  border-bottom: 1px solid var(--border-soft);
  line-height: 1.4;
}

.ingredient-list li:last-child { border-bottom: none; }

.ingredient-amount {
  font-weight: 500;
  color: var(--ink);
}

.step-list {
  list-style: none;
  counter-reset: steps;
}

.step-list li {
  counter-increment: steps;
  padding: 12px 0 12px 40px;
  font-size: 0.92rem;
  line-height: 1.7;
  color: var(--ink-secondary);
  position: relative;
  border-bottom: 1px solid var(--border-soft);
}

.step-list li:last-child { border-bottom: none; }

.step-list li::before {
  content: counter(steps);
  position: absolute;
  left: 0;
  top: 12px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--parchment);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--ink-tertiary);
}

.detail-note {
  margin-top: 32px;
  padding: 20px 24px;
  background: var(--saffron-light);
  border-left: 2px solid var(--saffron);
  border-radius: 0 3px 3px 0;
}

.detail-note-label {
  font-family: var(--font-hand);
  font-size: 1.1rem;
  color: var(--saffron);
  margin-bottom: 4px;
}

.detail-note-text {
  font-size: 0.9rem;
  line-height: 1.6;
  color: var(--ink-secondary);
  font-style: italic;
}

/* === EMPTY STATE === */
.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 80px 0;
}

.empty-state-text {
  font-family: var(--font-display);
  font-size: 1.2rem;
  font-style: italic;
  color: var(--ink-muted);
  margin-bottom: 8px;
}

.empty-state-sub {
  font-family: var(--font-hand);
  font-size: 1.1rem;
  color: var(--ink-muted);
}

/* === ANIMATIONS === */
@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-12px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeRight {
  from { opacity: 0; transform: translateX(-16px); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

/* === RESPONSIVE === */
@media (max-width: 1024px) {
  .header { padding: 32px 32px 0; }
  .main { padding: 24px 32px 40px; gap: 32px; }
  .recipe-grid { grid-template-columns: repeat(2, 1fr); }
  .recipe-card.featured { grid-column: span 2; grid-row: span 1; }
  .recipe-card.tall { grid-row: span 1; }
}

@media (max-width: 720px) {
  .header { flex-direction: column; gap: 16px; padding: 24px 20px 0; }
  .search-container { width: 100%; }
  .main { flex-direction: column; padding: 20px 20px 32px; gap: 24px; }
  .categories { width: 100%; display: flex; flex-wrap: wrap; gap: 4px; padding-top: 0; }
  .categories-label { display: none; }
  .category-item { width: auto; padding: 8px 14px; }
  .category-item.active::before { display: none; }
  .recipe-grid { grid-template-columns: 1fr; }
  .recipe-card.featured { grid-column: span 1; }
  .detail-panel { padding: 32px 24px; width: 100%; max-width: 100%; }
  .detail-columns { grid-template-columns: 1fr; gap: 28px; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <h1 class="logo">The Kitchen Journal</h1>
    <span class="logo-accent">a collection of favorites</span>
  </div>
  <div class="search-container">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" class="search-input" placeholder="Search recipes or ingredients..." id="searchInput">
  </div>
</header>

<main class="main">
  <nav class="categories" id="categories">
    <div class="categories-label">Sections</div>
  </nav>

  <section class="recipes-area">
    <div class="recipes-header">
      <h2 class="recipes-title" id="recipesTitle">All Recipes</h2>
      <span class="recipes-count" id="recipesCount"></span>
    </div>
    <div class="recipe-grid" id="recipeGrid"></div>
  </section>
</main>

<div class="detail-overlay" id="detailOverlay">
  <div class="detail-panel" id="detailPanel"></div>
</div>

<script>
const recipes = [
  {
    id: 1,
    title: "Honey-Glazed Salmon with Garden Herbs",
    category: "Mains",
    description: "Wild salmon baked under a golden cloak of honey and whole-grain mustard, finished with whatever herbs the garden offers. The glaze caramelizes into something almost burnt-sweet at the edges.",
    time: "35 min",
    servings: 4,
    difficulty: "Easy",
    featured: true,
    ingredients: [
      { amount: "4 fillets", name: "wild salmon" },
      { amount: "3 tbsp", name: "raw honey" },
      { amount: "2 tbsp", name: "whole-grain mustard" },
      { amount: "2 tbsp", name: "olive oil" },
      { amount: "3 cloves", name: "garlic, minced" },
      { amount: "1 tbsp", name: "soy sauce" },
      { amount: "handful", name: "fresh dill and thyme" },
      { amount: "1", name: "lemon, sliced" },
      { amount: "to taste", name: "flaky salt, black pepper" }
    ],
    steps: [
      "Heat oven to 200\u00b0C. Line a sheet pan with parchment \u2014 you'll thank yourself later.",
      "Whisk honey, mustard, olive oil, garlic, and soy sauce. It should taste almost too sweet on its own. The oven will balance it.",
      "Pat salmon dry. This matters more than any other step. Wet fish won't caramelize.",
      "Lay fillets skin-down on the pan. Spoon the glaze over each one generously. Tuck lemon slices between them.",
      "Bake 14\u201318 minutes. You want the glaze deeply golden and the fish just barely opaque at the thickest point.",
      "Rest 2 minutes. Scatter the herbs while still warm so they soften slightly. Finish with flaky salt."
    ],
    note: "The glaze works beautifully on chicken thighs too \u2014 just increase the baking time to 30 minutes.",
    tags: ["salmon", "honey", "herbs", "quick"]
  },
  {
    id: 2,
    title: "Sourdough Pancakes",
    category: "Breakfast",
    description: "Made from discard starter \u2014 the tang cuts through the butter and syrup in the best way.",
    time: "20 min",
    servings: 3,
    difficulty: "Easy",
    ingredients: [
      { amount: "1 cup", name: "sourdough discard" },
      { amount: "1", name: "egg" },
      { amount: "2 tbsp", name: "melted butter" },
      { amount: "2 tbsp", name: "sugar" },
      { amount: "\u00bd cup", name: "flour" },
      { amount: "\u00bd tsp", name: "baking soda" },
      { amount: "pinch", name: "salt" }
    ],
    steps: [
      "Mix the discard, egg, melted butter, and sugar until smooth.",
      "Add flour, baking soda, and salt. Stir just until combined \u2014 lumps are fine, overworking makes them tough.",
      "Heat a pan over medium. Butter it lightly. Pour rounds and wait for bubbles across the whole surface before flipping.",
      "Flip once. Cook another minute. Stack them up."
    ],
    note: "If your discard is very active, these will be extra fluffy. Cold discard from the fridge works perfectly.",
    tags: ["sourdough", "breakfast", "pancakes", "quick"]
  },
  {
    id: 3,
    title: "Slow-Roasted Tomato Soup",
    category: "Soups",
    description: "The roasting is the whole point. Forty minutes in high heat turns ordinary tomatoes into something caramelized and deeply sweet.",
    time: "1 hr",
    servings: 6,
    difficulty: "Easy",
    tall: true,
    ingredients: [
      { amount: "2 lbs", name: "roma tomatoes, halved" },
      { amount: "1 large", name: "yellow onion, quartered" },
      { amount: "6 cloves", name: "garlic, whole" },
      { amount: "3 tbsp", name: "olive oil" },
      { amount: "2 cups", name: "vegetable stock" },
      { amount: "\u00bc cup", name: "heavy cream" },
      { amount: "handful", name: "fresh basil" },
      { amount: "1 tsp", name: "smoked paprika" },
      { amount: "to taste", name: "salt, pepper, sugar" }
    ],
    steps: [
      "Oven to 220\u00b0C. Lay tomatoes cut-side up on a sheet pan with onion and garlic. Drizzle oil, season heavily.",
      "Roast 40 minutes. The tomatoes should be collapsed and charred at the edges. The garlic soft enough to squeeze.",
      "Scrape everything \u2014 juices included \u2014 into a pot. Add stock and paprika. Simmer 10 minutes.",
      "Blend until smooth. Stir in cream. Taste \u2014 a pinch of sugar rounds it if the tomatoes were acidic.",
      "Serve with torn basil and good bread."
    ],
    note: "Make double and freeze half. It only gets better.",
    tags: ["tomato", "soup", "roasted", "comfort"]
  },
  {
    id: 4,
    title: "Braised Short Ribs",
    category: "Mains",
    description: "Three hours of patience rewarded with meat that surrenders at the sight of a fork. The braising liquid becomes the sauce.",
    time: "3.5 hrs",
    servings: 4,
    difficulty: "Medium",
    ingredients: [
      { amount: "3 lbs", name: "bone-in short ribs" },
      { amount: "2", name: "carrots, chunked" },
      { amount: "2 stalks", name: "celery, chunked" },
      { amount: "1 large", name: "onion, diced" },
      { amount: "4 cloves", name: "garlic, crushed" },
      { amount: "2 cups", name: "red wine" },
      { amount: "2 cups", name: "beef stock" },
      { amount: "2 tbsp", name: "tomato paste" },
      { amount: "3 sprigs", name: "fresh thyme" },
      { amount: "2", name: "bay leaves" }
    ],
    steps: [
      "Season ribs aggressively with salt and pepper. Let them sit at room temperature 30 minutes.",
      "Sear in a hot Dutch oven, all sides, until deeply browned. Remove. This fond is everything.",
      "In the same pot: cook onion, carrot, celery until softened. Add garlic and tomato paste, stir 1 minute.",
      "Pour in wine. Scrape the bottom \u2014 every brown bit dissolves into flavor. Reduce by half.",
      "Add stock, thyme, bay leaves. Nestle the ribs back in. The liquid should come \u2154 up the sides.",
      "Cover. Oven at 160\u00b0C for 3 hours. Check once at the halfway mark.",
      "Remove ribs. Strain the liquid, pressing on the vegetables. Reduce the sauce until it coats a spoon."
    ],
    note: "Even better the next day. The fat solidifies on top and lifts right off.",
    tags: ["beef", "braised", "wine", "slow-cook"]
  },
  {
    id: 5,
    title: "Caramelized Onion & Gruy\u00e8re Pasta",
    category: "Mains",
    description: "Forty minutes of stirring onions is the price of admission. The Gruy\u00e8re melts into the pasta water to form a sauce that shouldn't work but does.",
    time: "55 min",
    servings: 4,
    difficulty: "Easy",
    ingredients: [
      { amount: "4 large", name: "yellow onions, sliced thin" },
      { amount: "3 tbsp", name: "butter" },
      { amount: "1 lb", name: "rigatoni or penne" },
      { amount: "6 oz", name: "Gruy\u00e8re, grated" },
      { amount: "2 tsp", name: "fresh thyme leaves" },
      { amount: "1 tbsp", name: "sherry vinegar" },
      { amount: "to taste", name: "salt, black pepper" }
    ],
    steps: [
      "Melt butter over medium heat. Add all the onions \u2014 it looks like too many. It isn't.",

const categories = ["All", ...new Set(recipes.map(r => r.category))];
let activeCategory = "All";

function getCategoryCount(cat) {
  if (cat === "All") return recipes.length;
  return recipes.filter(r => r.category === cat).length;
}

function renderCategories() {
  const nav = document.getElementById("categories");
  const label = nav.querySelector(".categories-label");
  nav.innerHTML = "";
  nav.appendChild(label);
  categories.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "category-item" + (cat === activeCategory ? " active" : "");
    btn.innerHTML = cat + '<span class="category-count">' + getCategoryCount(cat) + "</span>";
    btn.addEventListener("click", () => {
      activeCategory = cat;
      renderCategories();
      renderRecipes();
    });
    nav.appendChild(btn);
  });
}

function renderRecipes() {
  const grid = document.getElementById("recipeGrid");
  const query = document.getElementById("searchInput").value.toLowerCase().trim();

  let filtered = recipes;
  if (activeCategory !== "All") {
    filtered = filtered.filter(r => r.category === activeCategory);
  }
  if (query) {
    filtered = filtered.filter(r =>
      r.title.toLowerCase().includes(query) ||
      r.description.toLowerCase().includes(query) ||
      r.tags.some(t => t.includes(query)) ||
      r.ingredients.some(i => i.name.toLowerCase().includes(query))
    );
  }

  document.getElementById("recipesTitle").textContent =
    activeCategory === "All" ? "All Recipes" : activeCategory;
  document.getElementById("recipesCount").textContent =
    filtered.length + " recipe" + (filtered.length !== 1 ? "s" : "");

  if (filtered.length === 0) {
    grid.innerHTML =
      '<div class="empty-state">' +
      '<div class="empty-state-text">Nothing here yet</div>' +
      '<div class="empty-state-sub">try a different search or section</div>' +
      "</div>";
    return;
  }

  grid.innerHTML = "";
  filtered.forEach((recipe, i) => {
    const card = document.createElement("div");
    let cls = "recipe-card";
    if (recipe.featured && activeCategory === "All" && !query) cls += " featured";
    if (recipe.tall && activeCategory === "All" && !query) cls += " tall";
    card.className = cls;
    card.style.animationDelay = (0.1 + i * 0.07) + "s";

    const isFeatured = recipe.featured && activeCategory === "All" && !query;
    const showIngredients = isFeatured || recipe.tall;

    let html =
      '<div class="card-category">' + recipe.category + "</div>" +
      '<div class="card-title">' + recipe.title + "</div>" +
      '<div class="card-description">' + recipe.description + "</div>";

    if (showIngredients && recipe.ingredients.length > 0) {
      html += '<div class="card-divider"></div>';
      html += '<div class="card-ingredients">';
      html += '<div class="card-ingredients-label">Key ingredients</div>';
      html += '<div class="card-ingredients-list">';
      recipe.ingredients.slice(0, 5).forEach(ing => {
        html += '<span class="ingredient-tag">' + ing.name + "</span>";
      });
      html += "</div></div>";
    }

    if (isFeatured && recipe.note) {
      html += '<div class="card-note">\u201c' + recipe.note + '\u201d</div>';
    }

    html += '<div class="card-divider"></div>';
    html +=
      '<div class="card-meta">' +
      '<span class="card-meta-item">' +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' +
      recipe.time + "</span>" +
      '<span class="card-meta-item">' + recipe.servings + " servings</span>" +
      '<span class="card-meta-item">' + recipe.difficulty + "</span>" +
      "</div>";

    card.innerHTML = html;
    card.addEventListener("click", () => openDetail(recipe));
    grid.appendChild(card);
  });
}

function openDetail(recipe) {
  const overlay = document.getElementById("detailOverlay");
  const panel = document.getElementById("detailPanel");

  let html =
    '<button class="detail-close" id="detailClose">' +
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>' +
    "Back to recipes</button>" +
    '<div class="detail-category">' + recipe.category + "</div>" +
    '<h2 class="detail-title">' + recipe.title + "</h2>" +
    '<p class="detail-description">' + recipe.description + "</p>" +
    '<div class="detail-meta">' +
    '<div class="detail-meta-block"><span class="detail-meta-label">Time</span><span class="detail-meta-value">' + recipe.time + "</span></div>" +
    '<div class="detail-meta-block"><span class="detail-meta-label">Serves</span><span class="detail-meta-value">' + recipe.servings + "</span></div>" +
    '<div class="detail-meta-block"><span class="detail-meta-label">Difficulty</span><span class="detail-meta-value">' + recipe.difficulty + "</span></div>" +
    "</div>" +
    '<div class="detail-columns">' +
    '<div><h3 class="detail-section-title">Ingredients</h3><ul class="ingredient-list">';

  recipe.ingredients.forEach(ing => {
    html += "<li><span class=\"ingredient-amount\">" + ing.amount + "</span> " + ing.name + "</li>";
  });

  html +=
    "</ul></div>" +
    '<div><h3 class="detail-section-title">Method</h3><ol class="step-list">';

  recipe.steps.forEach(step => {
    html += "<li>" + step + "</li>";
  });

  html += "</ol></div></div>";

  if (recipe.note) {
    html +=
      '<div class="detail-note">' +
      '<div class="detail-note-label">A note</div>' +
      '<div class="detail-note-text">' + recipe.note + "</div>" +
      "</div>";
  }

  panel.innerHTML = html;
  overlay.classList.add("open");
  document.body.style.overflow = "hidden";

  document.getElementById("detailClose").addEventListener("click", closeDetail);
  overlay.addEventListener("click", function handler(e) {
    if (e.target === overlay) {
      closeDetail();
      overlay.removeEventListener("click", handler);
    }
  });
}

function closeDetail() {
  const overlay = document.getElementById("detailOverlay");
  const panel = document.getElementById("detailPanel");
  panel.style.transform = "translateX(40px)";
  panel.style.opacity = "0";
  setTimeout(() => {
    overlay.classList.remove("open");
    panel.style.transform = "";
    panel.style.opacity = "";
    document.body.style.overflow = "";
  }, 250);
}

document.getElementById("searchInput").addEventListener("input", renderRecipes);

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeDetail();
});

renderCategories();
renderRecipes();
</script>
